[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "whack"
version = "0.1.0"
description = "NBA research assistant with auditable statistical evidence"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "google-genai>=3,<4",
    "langgraph>=1.2,<2",
    "numpy>=2,<3",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<4",
    "pyarrow>=17",
    "scipy>=1.13,<2",
    "statsmodels>=0.14,<1",
    "pydantic>=2.9,<3",
    "python-dotenv>=1,<2",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.9,<1"]
data = ["nba_api>=1.4,<2"]

[tool.setuptools.packages.find]
include = ["backend*", "contracts*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
